<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TTC 大体染色拍照标签 · A4</title>
<style>
:root{
  --ink:#17171a;--muted:#66666d;--line:#b8b8bf;--paper:#fff;--canvas:#ececf1;
  --blue:#0b63ce;--green:#25824b;--orange:#b76500;--red:#c9342c;--purple:#554fc2;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--canvas);font-synthesis:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink)}
button,input,select{font:inherit}
.app-shell{min-height:100vh;padding:22px}
.control-panel{max-width:1120px;margin:0 auto 18px;background:rgba(255,255,255,.92);border:1px solid rgba(60,60,67,.16);border-radius:18px;box-shadow:0 14px 38px rgba(20,20,28,.08);overflow:hidden}
.control-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px 14px;border-bottom:1px solid rgba(60,60,67,.12)}
.control-title{display:flex;align-items:center;gap:12px}
.symbol{width:38px;height:38px;border-radius:11px;background:#1d1d1f;position:relative;box-shadow:0 7px 18px rgba(0,0,0,.16)}
.symbol::before{content:"";position:absolute;inset:10px;border:2px solid #fff;border-radius:50%}
.symbol::after{content:"";position:absolute;left:17px;top:6px;width:4px;height:26px;border-radius:2px;background:#fff;transform:rotate(48deg)}
h1{font-size:20px;line-height:1.2;margin:0;letter-spacing:-.02em}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid rgba(60,60,67,.18);border-radius:10px;background:#fff;color:var(--ink);padding:9px 13px;cursor:pointer}.actions button.primary{background:#007aff;border-color:#007aff;color:#fff;font-weight:700}.actions button:hover{filter:brightness(.97)}
.controls{display:grid;grid-template-columns:repeat(6,minmax(115px,1fr));gap:12px;padding:16px 20px}
.control{min-width:0}.control label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px 2px}.control input,.control select{width:100%;height:36px;padding:0 10px;border:1px solid rgba(60,60,67,.2);border-radius:9px;background:#fff;color:var(--ink);outline:none}.control input:focus,.control select:focus{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.footprint-map{display:grid;grid-template-columns:auto repeat(5,minmax(94px,1fr));align-items:end;gap:9px;padding:0 20px 16px}.footprint-map-title{align-self:center;font-size:12px;font-weight:700;color:#3a3a3f;white-space:nowrap}.footprint-map .control input{text-align:center;font-weight:750}
.status-row{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;background:#f7f7fa;border-top:1px solid rgba(60,60,67,.1);font-size:11px;color:var(--muted)}.status-ok{color:#21873c;font-weight:650}
.preview-wrap{max-width:1120px;margin:0 auto;overflow:auto;padding:6px 0 28px}
.sheet{width:210mm;height:297mm;margin:0 auto;background:var(--paper);box-shadow:0 18px 55px rgba(28,28,35,.18);padding:7mm 8mm 8mm;display:grid;grid-template-rows:12mm 1fr;gap:3mm;overflow:hidden}
.sheet-header{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:.35mm solid #1d1d1f;padding:0 .5mm 2.2mm}.sheet-kicker{font-size:2.5mm;text-transform:uppercase;letter-spacing:.14em;color:#5b5b61;font-weight:750}.sheet-title{font-size:5mm;line-height:1.1;font-weight:850;letter-spacing:-.025em;margin-top:.8mm}.sheet-meta{text-align:right;font-size:2.7mm;line-height:1.45;color:#3f3f44;font-variant-numeric:tabular-nums}.sheet-meta strong{font-size:3.4mm;color:#111}
.label-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:3mm 4mm;min-height:0}
.label-card{--accent:#6b6b73;position:relative;min-width:0;min-height:0;border:.34mm dashed #8c8c93;border-radius:1.5mm;padding:3.1mm 3.4mm 2.6mm;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:1.6mm;background:#fff;break-inside:avoid}
.label-card::before{content:"";position:absolute;left:-.2mm;top:-.2mm;bottom:-.2mm;width:1.55mm;background:var(--accent)}
.label-card::after{content:"✂";position:absolute;right:1.4mm;top:.6mm;font-size:2.4mm;color:#909097;background:#fff;padding-left:1mm}
.tone-blue{--accent:var(--blue)}.tone-green{--accent:var(--green)}.tone-orange{--accent:var(--orange)}.tone-red{--accent:var(--red)}.tone-purple{--accent:var(--purple)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:3mm;padding-left:.8mm}.site{font-size:4.1mm;line-height:1.12;font-weight:850;letter-spacing:-.02em}.site small{display:block;font-size:2.35mm;letter-spacing:.08em;color:#5f5f65;margin-bottom:.7mm;text-transform:uppercase}.animal{font-size:4.6mm;line-height:1;font-weight:900;letter-spacing:.02em;padding-right:3.2mm;white-space:nowrap}
.strategy{display:flex;align-items:center;justify-content:space-between;gap:2mm;padding:1.9mm 2.2mm;margin-left:.8mm;border:.3mm solid color-mix(in srgb,var(--accent) 38%,#fff);background:color-mix(in srgb,var(--accent) 7%,#fff);border-radius:1.5mm}.strategy-main{font-size:3.65mm;line-height:1.12;font-weight:850;color:var(--accent)}.strategy-sequence{font-size:2.2mm;line-height:1.2;text-align:right;color:#4f4f55;max-width:42%}.fp-id{display:inline-flex;align-items:center;justify-content:center;min-width:12mm;border:.3mm solid var(--accent);border-radius:1.2mm;padding:.7mm 1.5mm;margin-right:1.5mm;color:var(--accent);font-size:2.8mm;font-weight:850;vertical-align:.4mm}
.meta-strip{display:flex;align-items:center;gap:1.6mm;padding-left:.8mm;font-size:2.45mm;color:#3f3f44;font-weight:650}.meta-strip span{padding:.7mm 1.5mm;border:.25mm solid #c9c9cf;border-radius:99px;white-space:nowrap}.meta-strip .batch{max-width:34mm;overflow:hidden;text-overflow:ellipsis}
.write-area{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 3mm;align-content:start;padding:.2mm 0 0 .8mm}.write-line{display:flex;align-items:flex-end;min-width:0;gap:1.5mm;font-size:2.35mm;color:#49494f;white-space:nowrap}.write-line.wide{grid-column:1/-1}.write-line i{display:block;flex:1;min-width:8mm;height:3.8mm;border-bottom:.28mm solid #6f6f75}.write-line .prefill{flex:1;height:3.8mm;border-bottom:.28mm solid #6f6f75;font-size:2.55mm;color:#1d1d1f;font-style:normal;font-weight:700;overflow:hidden;text-overflow:ellipsis;text-align:center}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:2mm;padding:1.5mm 0 0 .8mm;border-top:.25mm solid #d0d0d5;font-size:2.2mm;color:#55555b}.checks{letter-spacing:.02em;white-space:nowrap}.study-tag{font-weight:650;white-space:nowrap}
.screen-note{max-width:1120px;margin:0 auto 20px;font-size:12px;line-height:1.7;color:#66666d}.screen-note b{color:#2e2e32}
@media(max-width:900px){.controls{grid-template-columns:repeat(2,minmax(130px,1fr))}.footprint-map{grid-template-columns:repeat(2,minmax(130px,1fr))}.footprint-map-title{grid-column:1/-1}.control-head{align-items:flex-start;flex-direction:column}.sheet{margin-left:0}.preview-wrap{padding-bottom:20px}}
@page{size:A4 portrait;margin:0}
@media print{
  :root{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{width:210mm;height:297mm;margin:0;background:#fff}
  .no-print{display:none!important}
  .app-shell{padding:0;margin:0;min-height:0}
  .preview-wrap{width:210mm;margin:0;padding:0;overflow:visible}
  .sheet{width:210mm;height:297mm;margin:0;padding:7mm 8mm 8mm;box-shadow:none;break-after:page}
  .label-card{border-color:#7b7b81}
}
</style>
</head>
<body>
<main class="app-shell">
  <section class="control-panel no-print" aria-label="打印设置">
    <div class="control-head">
      <div class="control-title"><span class="symbol" aria-hidden="true"></span><div><h1>TTC 大体染色拍照标签</h1><div class="subtitle">A4 纵向 · 8 张标签 · 打印后沿虚线剪裁</div></div></div>
      <div class="actions"><button onclick="loadCRFState()">从当前 CRF 读取分组</button><button onclick="resetForm()">恢复默认</button><button class="primary" onclick="window.print()">打印 / 保存 PDF</button></div>
    </div>
    <div class="controls">
      <div class="control"><label for="animal">动物编号</label><select id="animal"></select></div>
      <div class="control"><label for="endpoint">研究终点</label><select id="endpoint"><option value="2 h">即刻 2 h</option><option value="28 d">长期 28 d</option></select></div>
      <div class="control"><label for="side">房性方案侧别</label><select id="side"><option value="A">A · VP</option><option value="B">B · VP + RF</option></select></div>
      <div class="control"><label for="procedureDate">实验 / 取材日期</label><input id="procedureDate" type="date"></div>
      <div class="control"><label for="ttcTime">TTC 染色时间</label><input id="ttcTime" type="time"></div>
      <div class="control"><label for="batch">TTC 批次</label><input id="batch" placeholder="如 TTC-01"></div>
      <div class="control"><label for="operator">拍照 / 记录者</label><input id="operator" placeholder="姓名"></div>
    </div>
    <div class="footprint-map">
      <div class="footprint-map-title">LV Footprint 对应</div>
      <div class="control"><label>VP 4×</label><input id="fp-vp4" maxlength="3" placeholder="F__"></div>
      <div class="control"><label>VP 2×</label><input id="fp-vp2" maxlength="3" placeholder="F__"></div>
      <div class="control"><label>VP 2× + RF</label><input id="fp-vp2rf" maxlength="3" placeholder="F__"></div>
      <div class="control"><label>RF 450</label><input id="fp-rf" maxlength="3" placeholder="F__"></div>
      <div class="control"><label>RF + VP 2×</label><input id="fp-rfvp2" maxlength="3" placeholder="F__"></div>
    </div>
    <div class="status-row"><span>心房：A 侧 MI / Roof 为 VP 4×；B 侧为 VP 2× + SF 450 RF；RIPV 均为 VP 2× + SF 450 RF。</span><span id="sourceStatus" class="status-ok">使用方案默认分组</span></div>
  </section>

  <div class="screen-note no-print"><b>使用方法：</b>选择动物后会自动填入默认侧别、终点及 F01–F05 对应关系；如果 CRF 中重新随机过，请点击“从当前 CRF 读取分组”。建议打印比例选择 100%，关闭浏览器页眉页脚。</div>

  <div class="preview-wrap">
    <section class="sheet" aria-label="A4 TTC 拍照标签">
      <header class="sheet-header"><div><div class="sheet-kicker">20260827 Dual-form · Dual-energy study</div><div class="sheet-title">TTC 大体染色拍照标签</div></div><div id="sheetMeta" class="sheet-meta"></div></header>
      <div id="labelGrid" class="label-grid"></div>
    </section>
  </div>
</main>

<script>
const CRF_STORAGE='vp_stsf_porcine_v8';
const STRATEGY={
  vp4:{label:'VP 4× PFA',sequence:'VP ×4 PFA',tone:'blue'},
  vp2:{label:'VP 2× PFA',sequence:'VP ×2 PFA',tone:'green'},
  vp2rf:{label:'VP 2× PFA + SF 450 RF',sequence:'VP ×2 PFA → SF 450 RF',tone:'orange'},
  rf:{label:'SF 450 RF',sequence:'SF 450 RF',tone:'red'},
  rfvp2:{label:'SF 450 RF + VP 2× PFA',sequence:'SF 450 RF → VP ×2 PFA',tone:'purple'}
};
const DEFAULTS={
  P01:{side:'B',endpoint:'2 h',fp:{vp2rf:'F01',rfvp2:'F02',vp4:'F03',rf:'F04',vp2:'F05'}},
  P02:{side:'A',endpoint:'2 h',fp:{vp2rf:'F01',rf:'F02',vp4:'F03',vp2:'F04',rfvp2:'F05'}},
  P03:{side:'A',endpoint:'28 d',fp:{rfvp2:'F01',vp2rf:'F02',vp2:'F03',rf:'F04',vp4:'F05'}},
  P04:{side:'B',endpoint:'28 d',fp:{vp2:'F01',vp2rf:'F02',rf:'F03',vp4:'F04',rfvp2:'F05'}},
  P05:{side:'B',endpoint:'28 d',fp:{vp2:'F01',vp2rf:'F02',rf:'F03',vp4:'F04',rfvp2:'F05'}},
  P06:{side:'A',endpoint:'28 d',fp:{rf:'F01',vp2:'F02',vp2rf:'F03',vp4:'F04',rfvp2:'F05'}}
};
const CARD_PLAN=[
  {chamber:'LA',code:'MI',site:'二尖瓣峡部线',strategy:'atrial'},
  {chamber:'LA',code:'ROOF',site:'左房顶部线',strategy:'atrial'},
  {chamber:'LA',code:'RIPV',site:'右下肺静脉',strategy:'vp2rf'},
  {chamber:'LV',code:'VP4',site:'左室 Footprint',strategy:'vp4'},
  {chamber:'LV',code:'VP2',site:'左室 Footprint',strategy:'vp2'},
  {chamber:'LV',code:'VP2+RF',site:'左室 Footprint',strategy:'vp2rf'},
  {chamber:'LV',code:'RF',site:'左室 Footprint',strategy:'rf'},
  {chamber:'LV',code:'RF+VP2',site:'左室 Footprint',strategy:'rfvp2'}
];
let crfState=null;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function strategyKey(value){
  const s=String(value||'').toUpperCase().replaceAll('VARIPULSE','VP').replaceAll('STSF','SF').replaceAll('×','X');
  if(s.includes('SF 450 RF')&&s.lastIndexOf('VP')>s.indexOf('RF'))return 'rfvp2';
  if(s.includes('VP')&&s.includes('RF'))return 'vp2rf';
  if(s.includes('RF'))return 'rf';
  if(s.includes('VP 2X')||s.includes('PFA2'))return 'vp2';
  return 'vp4';
}
function currentAnimal(){return $('animal').value}
function roleFor(id){return ['P05','P06'].includes(id)?'备用 / 追加':'核心'}
function dataFor(id){
  const fallback=DEFAULTS[id];if(!crfState)return fallback;
  const a=crfState.animals?.find(x=>x.id===id);if(!a)return fallback;
  const fp={...fallback.fp};(a.ventFootprints||[]).forEach(f=>{fp[strategyKey(f.treatment)]=f.id||fp[strategyKey(f.treatment)]});
  const assessment=String(a.workflow?.assessmentTime||'');
  return {side:a.workflow?.armSide||a.randomCode||fallback.side,endpoint:assessment.includes('28')?'28 d':assessment.includes('2')?'2 h':fallback.endpoint,fp};
}
function applyAnimalDefaults(){
  const d=dataFor(currentAnimal());$('side').value=d.side;$('endpoint').value=d.endpoint;
  Object.entries(d.fp).forEach(([key,value])=>{const el=$('fp-'+key);if(el)el.value=value||''});render();
}
function loadCRFState(){
  try{const parsed=JSON.parse(localStorage.getItem(CRF_STORAGE)||'null');if(!parsed?.animals?.length)throw new Error('未找到同源 CRF 数据');crfState=parsed;$('sourceStatus').textContent='已读取当前浏览器 CRF 分组';applyAnimalDefaults()}
  catch(error){crfState=null;$('sourceStatus').textContent='未读取到 CRF，继续使用方案默认分组';applyAnimalDefaults()}
}
function resetForm(){
  crfState=null;$('animal').value='P01';$('procedureDate').value='';$('ttcTime').value='';$('batch').value='';$('operator').value='';$('sourceStatus').textContent='使用方案默认分组';applyAnimalDefaults();
}
function display(value,blank='____________'){return String(value||'').trim()||blank}
function cardHTML(card,index){
  const id=currentAnimal(),side=$('side').value,endpoint=$('endpoint').value,role=roleFor(id);
  const key=card.strategy==='atrial'?(side==='A'?'vp4':'vp2rf'):card.strategy,s=STRATEGY[key];
  const fp=card.chamber==='LV'?$('fp-'+key).value.trim().toUpperCase():'';
  const batch=$('batch').value.trim(),date=$('procedureDate').value,ttc=$('ttcTime').value,operator=$('operator').value.trim();
  return `<article class="label-card tone-${s.tone}">
    <div class="card-head"><div class="site"><small>${esc(card.chamber)} · ${esc(card.code)}</small>${esc(card.site)}</div><div class="animal">${esc(id)}</div></div>
    <div class="strategy"><div class="strategy-main">${fp?`<span class="fp-id">${esc(fp)}</span>`:''}${esc(s.label)}</div><div class="strategy-sequence">${esc(s.sequence)}</div></div>
    <div class="meta-strip"><span>${esc(endpoint)}</span><span>${esc(side)} 组</span><span>${esc(role)}</span>${batch?`<span class="batch">${esc(batch)}</span>`:''}</div>
    <div class="write-area">
      <div class="write-line"><span>标本 / 切面编号</span><i></i></div><div class="write-line"><span>拍照序号</span><i></i></div>
      <div class="write-line wide"><span>解剖定位 / 切面方向</span><i></i></div>
      <div class="write-line"><span>取材日期</span><span class="prefill">${esc(display(date,'　　-　-　'))}</span></div><div class="write-line"><span>TTC 时间</span><span class="prefill">${esc(display(ttc,'　:　'))}</span></div>
      <div class="write-line wide"><span>记录者</span><span class="prefill">${esc(display(operator,'　　　　　　　　　'))}</span></div>
    </div>
    <div class="card-foot"><span class="checks">□ 全景　□ 近景　□ 比例尺　□ 标签同框</span><span class="study-tag">${String(index+1).padStart(2,'0')} / 08</span></div>
  </article>`;
}
function render(){
  const id=currentAnimal(),side=$('side').value,endpoint=$('endpoint').value,date=$('procedureDate').value;
  $('labelGrid').innerHTML=CARD_PLAN.map(cardHTML).join('');
  $('sheetMeta').innerHTML=`<strong>${esc(id)} · ${esc(endpoint)} · ${esc(side)} 组</strong><br>${esc(roleFor(id))}${date?' · '+esc(date):''}`;
}
function init(){
  $('animal').innerHTML=Object.keys(DEFAULTS).map(id=>`<option value="${id}">${id}</option>`).join('');
  $('animal').addEventListener('change',applyAnimalDefaults);
  ['endpoint','side','procedureDate','ttcTime','batch','operator','fp-vp4','fp-vp2','fp-vp2rf','fp-rf','fp-rfvp2'].forEach(id=>$(id).addEventListener('input',render));
  try{const parsed=JSON.parse(localStorage.getItem(CRF_STORAGE)||'null');if(parsed?.animals?.length){crfState=parsed;$('sourceStatus').textContent='已自动读取当前浏览器 CRF 分组'}}catch(ignore){}
  applyAnimalDefaults();
}
init();
</script>
</body>
</html>
